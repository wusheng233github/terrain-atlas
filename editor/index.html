<html>

<head>
    <title>图像查看器</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="../tga.js"></script>
    <script src="../utils.js"></script>

        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        integrity="sha512-WiGQZv8WpmQVRUFXZywo7pHIO0G/o3RyiAJZj8YXNN4AV7ReR1RYWVmZJ6y3H06blPcjJmG/sBpOVZjTSFFlzQ=="

    <!-- onerror="更新信息栏('Cloudflare Web Analytics加载失败，建议将本站添加到白名单\nEdge桌面浏览器打开地址栏锁头图标，关闭“此网站的跟踪保护”\n打开广告拦截插件的控制面板，找到并点击大开关按钮将其关闭\n我理解您使用广告拦截器的原因，但本站不依赖广告收入支持运营')" -->
</head>

<body>
    <canvas id="previewCanvas"></canvas>

    <div id="shortcutHint" class="hint-label 左 上"></div>
    <div class="hint-label 右 上 active">
        <p id="time">时间</p>
        <p>测试版，TODO:</p>
        <p>编辑功能</p>
        <p>&emsp;编辑UV (50%)</p>
        <p>&emsp;编辑映射 (40%)</p>
        <p>&emsp;编辑图集大小</p>
        <p>&emsp;撤销/重做 (2%)</p>
        <p>&emsp;创建图集</p>
        <p>浏览</p>
        <p>&emsp;动态纹理</p>
        <p>&emsp;随机纹理</p>
        <p>&emsp;纹理包TGA图片</p>
        <!-- 不做blockbench一样 -->
        <p>纹理包解析</p>
        <p>&emsp;解析方块状态</p>
        <p>&emsp;解析方块模型</p>
        <p>&emsp;导入java版纹理图集</p>
        <!--<p>&emsp;双指缩放时移动 ✔</p>-->
        <p>手机端优化 (40%)</p>
        <p>导入导出</p>
        <p>&emsp;导入PNG纹理图集</p>
        <p>&emsp;导出纹理包</p>
        <!--<p>&emsp;导出元数据 ✔</p>
        <p>&emsp;导出图集 ✔</p>
        <p>应用映射文件 ✔</p>
        <p>Mipmap生成工具 ✔</p>-->
    </div>

    <div id="bottomPanel">
        <div class="panel-left" id="bottomPanelLeft">
        </div>

        <div class="panel-right" id="bottomPanelRight">
            <div class="bg-controls">
                <button class="bg-btn black active" title="黑色背景 (B)"></button>
                <button class="bg-btn white" title="白色背景 (B)"></button>
                <button class="bg-btn gray" title="灰色背景 (B)"></button>
            </div>

            <button id="infoBtn" class="btn info-btn active" title="显示详细信息 (I)">i</button>
        </div>
    </div>

    <div id="infoPopup" class="popup-panel 右 下 active">
        <pre id="info"></pre>
    </div>

    <script src="script.js"></script>
            <!-- 做好再合并到script.js -->
            <script src="operation.js"></script>
            <script src="mobile.js"></script>

            <script src="resourceloader.js"></script>
                <script src="mipmap.js"></script>
                <script src="TexturePackLoader.js"></script>
                <script src="editor.js"></script>
                <script src="mapping.js"></script>

</body>

</html>
